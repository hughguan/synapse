name: Synapse Lifecycle Validation

on: [push, pull_request]

jobs:
  test-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh tmux software-properties-common
          sudo add-apt-repository ppa:neovim-ppa/stable -y
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Create Dummy Original Files
        run: |
          echo "DUMMY_GIT" > "$HOME/.gitconfig"
          echo "DUMMY_TMUX" > "$HOME/.tmux.conf"
          mkdir -p "$HOME/.config/nvim"
          echo "DUMMY_NVIM" > "$HOME/.config/nvim/init.lua"

      - name: Run Synapse Setup
        shell: zsh {0}
        run: |
          chmod +x skills/synapse/scripts/synapse.zsh
          ./skills/synapse/scripts/synapse.zsh --setup

      - name: Verify Setup Overrides
        run: |
          # Ensure they are regular files/dirs, not symlinks
          [ -f "$HOME/.gitconfig" ] && [ ! -L "$HOME/.gitconfig" ] && echo "✅ Git override OK"
          [ -f "$HOME/.tmux.conf" ] && [ ! -L "$HOME/.tmux.conf" ] && echo "✅ Tmux override OK"
          [ -d "$HOME/.config/nvim" ] && [ ! -L "$HOME/.config/nvim" ] && echo "✅ Neovim directory override OK"
          [ -f "$HOME/.config/nvim/init.lua" ] && echo "✅ init.lua exists OK"

      - name: Headless Neovim Check
        run: |
          nvim --headless +qa && echo "✅ Neovim configuration is valid"

      - name: Run Synapse Remove
        shell: zsh {0}
        run: |
          ./skills/synapse/scripts/synapse.zsh --remove

      - name: Verify Restoration
        run: |
          # 1. Ensure dummy content is back
          grep -q "DUMMY_GIT" "$HOME/.gitconfig" && echo "✅ Git restored OK"
          grep -q "DUMMY_TMUX" "$HOME/.tmux.conf" && echo "✅ Tmux restored OK"
          grep -q "DUMMY_NVIM" "$HOME/.config/nvim/init.lua" && echo "✅ Neovim restored OK"

          # 2. Ensure they are not symlinks
          [ ! -L "$HOME/.gitconfig" ] && echo "✅ Git is not a symlink OK"
          [ ! -L "$HOME/.tmux.conf" ] && echo "✅ Tmux is not a symlink OK"
          [ ! -L "$HOME/.config/nvim" ] && echo "✅ Neovim is not a symlink OK"
