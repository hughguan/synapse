# ==========================================
# 1. Basic Settings & Keybind Overrides
# ==========================================
# Change default Prefix from Ctrl+b to Ctrl+a (more ergonomic)
set -g prefix C-x
unbind C-b
bind C-x send-prefix

# Enable mouse support (resize panes, click to switch windows)
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

# Start windows and panes at 1, not 0 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Remove delay when pressing ESC in Neovim (Crucial for Vim users!)
set -sg escape-time 0

# Press Prefix + r to reload the tmux configuration instantly.
# It also prints a message at the bottom so you know it worked.
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded successfully!"

# ==========================================
# 2. Color & Terminal Compatibility
# ==========================================
set -g default-terminal "screen-256color"
# Force True Color (RGB) support for Neovim
set-option -sa terminal-overrides ",xterm-256color:RGB"

# ==========================================
# 3. Smart Pane
# ==========================================
# Split panes using | and - (keeps current directory path)
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Enable vi keys in copy mode (Prefix + [ to enter, hjkl to move, v to select, y to yank)
setw -g mode-keys vi

# Allows seamless navigation between tmux panes and vim splits using C-h/j/k/l
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# ==========================================
# 4. Tmux Plugin Manager & Resurrection
# ==========================================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Configure Resurrect
# Restore Neovim sessions (if you use a session plugin in nvim)
set -g @resurrect-strategy-nvim 'session'
# Restore pane contents (e.g., active man pages, less outputs, or running scripts)
set -g @resurrect-capture-pane-contents 'on'

# Configure Continuum
# Automatically save the tmux environment in the background every 15 minutes
set -g @continuum-save-interval '15'
# Automatically restore the last saved session when tmux starts
set -g @continuum-restore 'on'

# Theme
set -g @plugin 'samharju/tmux-synthweave-theme'

# Plugin to enable CPU and RAM metrics
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @synthweave_widgets 'C #{cpu_fg_color}#{cpu_percentage}#[default] M #{ram_fg_color}#{ram_percentage}#[default] #{sep}'

# ==========================================
# 5. AI Integration
# ==========================================
# Press Prefix + g to instantly open a new panel running Gemini CLI.
# -c '#{pane_current_path}' : Starts the CLI in your current project directory.
# -h                        : Split the window horizontally (creating a right panel).
#
# Workflow:
# 1. Hit Prefix + g -> A new full-screen tab opens for your AI chat.
# 2. Chat, generate code, copy what you need.
# 3. Type '/quit' or press Ctrl+d -> The CLI stops, and the tab automatically closes!
bind g split-window -h -c '#{pane_current_path}' "gemini"

# ==========================================
# ⚠️ Initialize TMUX plugin manager 
# (Keep this line at the very bottom of tmux.conf)
# ==========================================
run '~/.tmux/plugins/tpm/tpm'
